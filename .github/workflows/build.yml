name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: token-deck/package-lock.json

      - name: Install & test Token Deck
        run: cd token-deck && npm ci && npx tsc --noEmit && npm test

      - name: Build release binary
        run: cd macos && swift build -c release

      - name: Run tests
        run: cd macos && swift test

      - name: Build app archives
        run: make release-artifacts

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClaudeUsageBar.zip
          path: macos/ClaudeUsageBar.zip

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClaudeUsageBar.dmg
          path: macos/ClaudeUsageBar.dmg
